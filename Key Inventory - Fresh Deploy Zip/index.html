        <div class="tfloat" id="xf4">${tav('A', '', 30)}<div class="tfn"><b>Anna</b> added you as a friend</div><div class="tfbt"><span class="tacc" id="xf5">Accept</span><span class="tdec">Decline</span></div></div>
        <div class="tconn" id="xf6"><b>\u2713 Connected</b><small>Anna and Joel are band members, songs in sync</small></div></div></div>`,
    run: (r, T) => {
      tutAnim(r, T, '#xf1', tType('', 700, 2600, 118, 15)); tutAnim(r, T, '#xf2', tPop(2800));
      tutAnim(r, T, '#xf3a', tFade(0, 4900)); tutAnim(r, T, '#xf3b', tFade(4900)); tutAnim(r, T, '#xf3a', tPulse(4300, 1, 600));
      tutAnim(r, T, '#xf4', [[0, { opacity: 0, transform: 'translateY(-26px) scale(.95)' }], [5400, { opacity: 0, transform: 'translateY(-26px) scale(.95)' }], [5900, { opacity: 1, transform: 'none' }], [8600, { opacity: 1, transform: 'none' }], [9000, { opacity: 0, transform: 'translateY(-10px)' }]]);
      tutAnim(r, T, '#xf5', tPulse(7900, 1, 600)); tutAnim(r, T, '#xf6', tPop(9200));
      tutFinger(r, T, [[900, 200, 340], [4300, 208, 110, true], [7800, 91, 199, true]]);
    } },

  { ch: 'team', T: 14000, title: 'One band for everyone',
    text: 'Pick one person, usually the worship leader, to add everyone. Everybody else just accepts. Everyone then lands in ONE band, grouped by their part (guitarists together, drummers together), and everything stays in sync.',
    html: () => `<div class="tl tpad2"><div class="tbm2">
        <div class="tbg" id="xg1"><h5>Worship leader <i>1</i></h5><div class="tbc">${tav('A', '', 26)}<b>Anna</b></div></div>
        <div class="tbg" id="xg2"><h5>Guitarist <i>2</i></h5><div class="tbc">${tav('J', '', 26)}<b>Joel</b></div><div class="tbc" id="xg5">${tav('D', '', 26)}<b>Dan</b></div></div>
        <div class="tbg" id="xg3"><h5>Vocalist <i>1</i></h5><div class="tbc">${tav('N', '', 26)}<b>Nelie</b></div></div>
        <div class="tbg" id="xg4"><h5>Drummer <i>1</i></h5><div class="tbc">${tav('M', '', 26)}<b>Mia</b></div></div></div>
      <div class="trule" id="xg6"><b>1.</b> One person adds everyone</div>
      <div class="trule" id="xg7"><b>2.</b> Everyone else just accepts</div>
      <div class="tone" id="xg8">\u2713 ONE band, all in sync</div></div>`,
    run: (r, T) => {
      tutAnim(r, T, '#xg1', tPop(300)); tutAnim(r, T, '#xg2', tPop(2200)); tutAnim(r, T, '#xg3', tPop(3600)); tutAnim(r, T, '#xg4', tPop(5000)); tutAnim(r, T, '#xg5', tPop(6800));
      tutAnim(r, T, '#xg6', tPop(2000)); tutAnim(r, T, '#xg7', tPop(5400)); tutAnim(r, T, '#xg8', tPop(9000)); tutAnim(r, T, '#xg8', tPulse(9800, 2, 700));
      tutFinger(r, T, [[900, 150, 252]]);
    } },

  { ch: 'end', T: 4500, title: 'You are ready',
    text: 'You can open this tutorial again any time in Settings. There are also two short tours: one for the Setlist and one for Play mode.',
    html: () => `<div class="tl tcenter"><div class="tdone" id="done">\u2713</div><b class="tdt" id="dtt">Ready to play</b><div class="tdchips" id="dch"><span class="tchip on">\u2605 Setlist</span><span class="tchip on">\u2605 Play mode</span></div></div>`,
    run: (r, T) => { tutAnim(r, T, '#done', [[0, { opacity: 0, transform: 'scale(.4)' }], [300, { opacity: 0, transform: 'scale(.4)' }], [900, { opacity: 1, transform: 'scale(1.12)' }], [1200, { opacity: 1, transform: 'scale(1)' }]]); tutAnim(r, T, '#dtt', tPop(1300)); tutAnim(r, T, '#dch', tPop(1800)); } }
];

/* ---------- showing the tutorial ---------- */
function tutRangeFor(ch) { const idx = TUT_STEPS.map((s, i) => s.ch === ch ? i : -1).filter(i => i >= 0); return idx.length ? [idx[0], idx[idx.length - 1]] : null; }
function tutOpen(from, range) {
  TUT.range = range || null; TUT.open = true; TUT.auto = true; TUT.paused = false;
  const o = $('#tut'); o.hidden = false; o.classList.remove('paused');
  $('#tutPlay').textContent = '\u275A\u275A'; $('#tutPlay').setAttribute('aria-label', 'Pause');
  tutBuildChips();
  tutShow(from || 0);
  $('#tutNext').focus();
}
function tutClose() {
  TUT.open = false; $('#tut').hidden = true; clearInterval(TUT.tick); TUT.anims.forEach(a => { try { a.cancel(); } catch (e) { /* ignore */ } }); TUT.anims = [];
  kv.set('ki-tutorial-seen', '1'); TUT.seen = true; if (state.viewMode === 'photos') renderPhotos(); else renderList();
}
function tutBuildChips() {
  $('#tutChips').innerHTML = TUT_CHIPS.map(c => `<button class="tut-chip${c === 'setlist' || c === 'play' ? ' star' : ''}" data-ch="${c}">${c === 'setlist' || c === 'play' ? '\u2605 ' : ''}${TUT_CH[c]}</button>`).join('');
}
function tutShow(i) {
  const lo = TUT.range ? TUT.range[0] : 0, hi = TUT.range ? TUT.range[1] : TUT_STEPS.length - 1;
  i = Math.max(lo, Math.min(hi, i)); TUT.i = i;
  const st = TUT_STEPS[i];
  clearInterval(TUT.tick); TUT.anims.forEach(a => { try { a.cancel(); } catch (e) { /* ignore */ } }); TUT.anims = [];
  const scr = $('#tutScr'); scr.innerHTML = st.html() + '<span class="tf" aria-hidden="true"></span>';
  scr.dataset.step = i;
  st.run(scr, st.T);
  TUT.T = st.T; TUT.elapsed = 0;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) TUT.anims.forEach(a => { try { a.finish(); } catch (e) { /* ignore */ } });
  const star = st.ch === 'setlist' || st.ch === 'play';
  const badge = $('#tutBadge'); badge.textContent = (star ? '\u2605 ' : '') + TUT_CH[st.ch]; badge.className = 'tut-badge ' + st.ch + (star ? ' star' : '');
  $('#tutTitle').textContent = st.title; $('#tutCaption').textContent = st.text;
  $('#tutPrev').disabled = i <= lo;
  const last = i >= hi;
  $('#tutNext').textContent = last ? 'Finish' : 'Next \u203A';
  document.querySelectorAll('.tut-chip').forEach(b => b.classList.toggle('on', b.dataset.ch === st.ch));
  $('#tutDots').innerHTML = TUT_STEPS.map((s, k) => (k < lo || k > hi) ? '' : `<button class="tut-seg ${s.ch}${k === i ? ' now' : ''}${k < i ? ' done' : ''}" data-i="${k}" aria-label="Step ${k + 1}: ${esc(s.title)}"><i style="animation-duration:${st.T + 1800}ms"></i></button>`).join('');
  $('#tutCta').innerHTML = st.ch === 'end' ? '<button class="btn" id="tutTourSet">\u2605 Setlist tour</button><button class="btn" id="tutTourPlay">\u2605 Play mode tour</button><button class="btn" id="tutReplay">Watch again</button>' : '';
  tutFit();
  TUT.tick = setInterval(() => {
    if (TUT.paused) return;
    TUT.elapsed += 100;
    if (TUT.auto && TUT.elapsed >= TUT.T + 1800) { if (TUT.i < hi) tutShow(TUT.i + 1); else { clearInterval(TUT.tick); } }
  }, 100);
}
function tutFit() {
  const box = $('#tutBox'), sc = $('#tutScale'); if (!box) return;
  const w = box.clientWidth - 8, h = box.clientHeight - 8;
  const s = Math.max(.3, Math.min(1.25, w / 300, h / 390));
  sc.style.transform = `scale(${s})`; sc.style.width = '300px'; sc.style.height = '390px';
  box.style.setProperty('--tw', Math.round(300 * s) + 'px'); box.style.setProperty('--th', Math.round(390 * s) + 'px');
}
function tutSetPaused(p) {
  TUT.paused = p; $('#tut').classList.toggle('paused', p);
  TUT.anims.forEach(a => { try { p ? a.pause() : a.play(); } catch (e) { /* ignore */ } });
  $('#tutPlay').textContent = p ? '\u25B6' : '\u275A\u275A'; $('#tutPlay').setAttribute('aria-label', p ? 'Play' : 'Pause');
}
function tutNext() {
  const hi = TUT.range ? TUT.range[1] : TUT_STEPS.length - 1;
  if (TUT.i >= hi) { tutClose(); return; }
  TUT.auto = true; tutShow(TUT.i + 1);
}
$('#tutNext').addEventListener('click', tutNext);
$('#tutPrev').addEventListener('click', () => { tutShow(TUT.i - 1); });
$('#tutPlay').addEventListener('click', () => tutSetPaused(!TUT.paused));
$('#tutClose').addEventListener('click', tutClose);
$('#tutChips').addEventListener('click', (e) => { const b = e.target.closest('[data-ch]'); if (!b) return; TUT.range = null; tutShow(tutRangeFor(b.dataset.ch)[0]); });
$('#tutDots').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) tutShow(Number(b.dataset.i)); });
$('#tutCta').addEventListener('click', (e) => {
  const id = e.target.id;
  if (id === 'tutTourSet') { const r = tutRangeFor('setlist'); TUT.range = r; tutShow(r[0]); }
  else if (id === 'tutTourPlay') { const r = tutRangeFor('play'); TUT.range = r; tutShow(r[0]); }
  else if (id === 'tutReplay') { TUT.range = null; tutShow(0); }
});
document.addEventListener('keydown', (e) => {
  if (!TUT.open) return;
  if (e.key === 'Escape') { e.preventDefault(); tutClose(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); tutNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('#tutPrev').disabled) tutShow(TUT.i - 1); }
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); tutSetPaused(!TUT.paused); }
});
window.addEventListener('resize', () => { if (TUT.open) tutFit(); });
window.addEventListener('orientationchange', () => setTimeout(() => { if (TUT.open) tutFit(); }, 250));
TUT.seen = kv.get('ki-tutorial-seen') === '1';

const renderDetailCore = renderDetail;
renderDetail = function () { renderDetailCore(); enhanceWheels(); };

/* if the app is hosted on Firebase Hosting, the settings are provided at /__/firebase/init.json: nothing to fill in at all */
async function hostedFirebase() {
  if (CLOUD.cfg || !/^https?:$/.test(location.protocol)) return;
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('/__/firebase/init.json', { signal: ctl.signal, cache: 'no-store' }); clearTimeout(t);
    const c = r.ok ? await r.json() : null;
    if (c && c.apiKey && c.projectId && c.appId) { BUILT_IN_FIREBASE = c; CLOUD.cfg = c; }
  } catch (e) { /* not on Firebase Hosting: firebase.js is used */ }
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* optional */ } }
(async function init() {
  await load();
  applyListCols();
  await hostedFirebase();
  applyTheme();
  if (!state.songs.find(s => s.id === state.selectedId)) state.selectedId = null;
  state.viewMode = ['view', 'singer', 'photos', 'setlist'].includes(state.viewMode) ? state.viewMode : 'view';
  syncModeUI();
  renderList();
  renderDetail();
  cloudInit();
})();
</script>
